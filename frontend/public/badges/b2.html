<!DOCTYPE html>

<head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden">
  
  <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[500px] h-[500px] bg-orange-500/10 rounded-full blur-[120px] pointer-events-none"></div>

      <h2 class="font-extrabold text-base tracking-tight text-orange-400 font-sans">AspireNext Credentials</h2>
    </div>

    <!-- Glowing 3D Medal -->
    <div class="relative w-32 h-32 mx-auto mb-8 flex items-center justify-center rounded-full bg-gradient-to-br from-amber-400 via-orange-500 to-red-600 border-4 border-amber-250 shadow-[0_0_30px_rgba(245,158,11,0.6)]">
      <div class="absolute top-2 left-6 w-10 h-4 bg-white/20 rounded-full blur-[1px] rotate-[-15deg]"></div>

      <svg class="w-16 h-16 text-white drop-shadow-[0_4px_12px_rgba(255,255,255,0.4)] animate-pulse" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>

      </svg>
    </div>

    <span class="bg-orange-500/10 text-orange-400 px-3 py-1 rounded-full text-xs font-extrabold uppercase tracking-wide border border-orange-500/20">Epic Badge</span>
    <h1 class="font-black text-2xl mt-4 mb-2 text-slate-100 tracking-tight">Streak Master</h1>
    <p class="text-sm font-semibold text-slate-400 leading-relaxed max-w-xs mx-auto mb-8">
      Earned by maintaining a 30-day active learning streak on AspireNext LMS.
    </p>

    <div class="h-px bg-slate-800 w-full mb-8"></div>

    <div class="space-y-4">
      <p class="text-xs font-bold text-slate-500 uppercase tracking-widest">Verify Credential</p>
      <div class="bg-slate-950/80 rounded-2xl p-4 border border-slate-800 flex items-center justify-between text-left">
        <div>
          <p class="text-[10px] font-black text-slate-500 uppercase tracking-wider">Verification Status</p>
          <p class="text-xs font-extrabold text-emerald-400 flex items-center gap-1.5 mt-0.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Active & Verified
          </p>
        </div>
        <a href="https://aspirenext.in" target="_blank" class="px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 hover:bg-slate-800 text-xs font-extrabold transition-all text-slate-200">
          Verify LMS
        </a>

<!DOCTYPE html>

<head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden">
  
  <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[500px] h-[500px] bg-rose-500/10 rounded-full blur-[120px] pointer-events-none"></div>

  <div class="relative z-10 w-full max-w-md bg-slate-900/60 backdrop-blur-xl border border-slate-800 rounded-[2.5rem] p-8 sm:p-10 shadow-2xl text-center">
    
    <div class="flex items-center justify-center gap-2 mb-8">
      <span class="bg-rose-500 text-white font-black text-[10px] uppercase tracking-wider px-2 py-0.5 rounded">LMS</span>
      <h2 class="font-extrabold text-base tracking-tight text-rose-400 font-sans">AspireNext Credentials</h2>
    </div>

    <!-- Glowing 3D Medal -->
    <div class="relative w-32 h-32 mx-auto mb-8 flex items-center justify-center rounded-full bg-gradient-to-br from-red-500 via-rose-600 to-rose-800 border-4 border-rose-250 shadow-[0_0_30px_rgba(244,63,94,0.55)]">
      <div class="absolute top-2 left-6 w-10 h-4 bg-white/20 rounded-full blur-[1px] rotate-[-15deg]"></div>
      
      <!-- Trophy Icon -->
      <svg class="w-16 h-16 text-white drop-shadow-[0_4px_12px_rgba(255,255,255,0.4)]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.45 1-1 1H4v2h16v-2h-5c-.55 0-1-.45-1-1v-2.34M12 2a4 4 0 0 1 4 4v5a4 4 0 0 1-4 4 4 4 0 0 1-4-4V6a4 4 0 0 1 4-4Z"></path>
      </svg>
    </div>

    <span class="bg-rose-500/10 text-rose-400 px-3 py-1 rounded-full text-xs font-extrabold uppercase tracking-wide border border-rose-500/20">Epic Badge</span>
    <h1 class="font-black text-2xl mt-4 mb-2 text-slate-100 tracking-tight">Quiz Champion</h1>
    <p class="text-sm font-semibold text-slate-400 leading-relaxed max-w-xs mx-auto mb-8">
      Earned by scoring 90% or higher on 10 course quizzes on AspireNext LMS.
    </p>

    <div class="h-px bg-slate-800 w-full mb-8"></div>

    <div class="space-y-4">
      <p class="text-xs font-bold text-slate-500 uppercase tracking-widest">Verify Credential</p>
      <div class="bg-slate-950/80 rounded-2xl p-4 border border-slate-800 flex items-center justify-between text-left">
        <div>
          <p class="text-[10px] font-black text-slate-500 uppercase tracking-wider">Verification Status</p>
          <p class="text-xs font-extrabold text-emerald-400 flex items-center gap-1.5 mt-0.5">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Active & Verified
          </p>
        </div>
        <a href="https://aspirenext.in" target="_blank" class="px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 hover:bg-slate-800 text-xs font-extrabold transition-all text-slate-200">
          Verify LMS
        </a>
      </div>
    </div>

  </div>

  <p class="text-2xs font-extrabold text-slate-600 uppercase tracking-widest mt-8 relative z-10">&copy; 2026 AspireNext. All Rights Reserved.</p>
